name: Neo.Tax
description: >-
  Neo.Tax is an AI-powered tax automation platform that helps enterprises and
  their accounting teams generate audit-ready R&D tax credit studies, software
  capitalization (ASC 350-40), and R&D capitalization (IRC Section 174)
  documentation. The platform ingests engineering and financial data from tools
  like Jira, GitHub, payroll systems, and Workday and uses large language models
  and agentic AI to qualify projects under IRC Section 41, eliminating the manual
  surveys and interviews that traditionally drive R&D tax credit work. Neo.Tax is
  backed by GV and Uncork Capital and delivered as a closed enterprise SaaS
  product; it operates a customer application, a help center, a public status
  page, and a trust center (SOC 2 Type II, ISO/IEC 27001:2022, GDPR) but does not
  publish a public developer API, SDKs, or API documentation.
